name: Update Sii-Football API

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypdf

      - name: Fetch and parse para-football data
        run: |
          python scripts/fetch_data.py
          python scripts/parse_leagues.py
          python scripts/parse_standings.py
          python scripts/validate_api.py
          python - << 'PY'
          import json, subprocess
          out = subprocess.check_output(["python", "scripts/siimatchmind_client.py"], text=True, encoding="utf-8")
          summary = json.loads(out[out.find("{"):])
          with open("api/siimatchmind_summary.json", "w", encoding="utf-8") as fp:
              json.dump(summary, fp, ensure_ascii=False, indent=2)
          PY

      - name: Commit and push updated API files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore: update para-football API endpoints [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No API changes detected."
          fi

      - name: Verify live GitHub Pages API endpoints
        run: |
          sleep 20
          python - << 'PY'
          import json
          import time
          from urllib.error import URLError
          from urllib.request import Request, urlopen

          base_url = "https://siiberram.github.io/Sii-Football/api"
          endpoints = [
              "index.json",
              "sources.json",
              "news.json",
              "leagues.json",
              "standings.json",
              "disclaimer.json",
              "siimatchmind_summary.json",
          ]
          headers = {"User-Agent": "SiiFootballCI/1.0"}

          for ep in endpoints:
              url = f"{base_url}/{ep}"
              last_err = None
              for attempt in range(4):
                  try:
                      req = Request(url, headers=headers)
                      with urlopen(req, timeout=20) as resp:
                          status = resp.getcode()
                          body = resp.read().decode("utf-8")
                          if status != 200:
                              raise RuntimeError(f"HTTP {status} for {url}")
                          parsed = json.loads(body)
                          if not isinstance(parsed, dict) or not parsed:
                              raise RuntimeError(f"Empty or non-object JSON in {url}")
                          print(f"LIVE OK ({status}): {url} | keys={len(parsed)}")
                          last_err = None
                          break
                  except (URLError, TimeoutError, ValueError, RuntimeError) as exc:
                      last_err = exc
                      time.sleep(5)
              if last_err is not None:
                  raise SystemExit(f"Live verification failed for {url}: {last_err}")
          PY
