name: Update Sii-Football API

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypdf

      - name: Fetch and parse para-football data
        run: |
          python scripts/fetch_data.py
          python scripts/parse_leagues.py
          python scripts/parse_standings.py
          python scripts/validate_api.py
          python - << 'PY'
          import json, os, subprocess, sys

          sys.path.insert(0, "scripts")
          try:
              import siimatchmind_client as client_mod
          except Exception:
              client_mod = None

          all_cats = []
          for c in getattr(client_mod, "ALL_SPORT_CATEGORIES", []) or []:
              if isinstance(c, str) and c.strip() and c not in all_cats:
                  all_cats.append(c)

          for path in ["api/sources.json", "api/leagues.json", "api/news.json", "api/standings.json"]:
              if not os.path.exists(path):
                  continue
              with open(path, encoding="utf-8") as f:
                  d = json.load(f)
              if isinstance(d, dict):
                  for k in ["by_category", "categories"]:
                      if isinstance(d.get(k), dict):
                          for c in d[k].keys():
                              if isinstance(c, str) and c.strip() and c not in all_cats:
                                  all_cats.append(c)
                  for key in ["sources", "competitions", "matches", "standings", "items"]:
                      for row in (d.get(key) or []):
                          if isinstance(row, dict):
                              c = row.get("category")
                              if isinstance(c, str) and c.strip() and c not in all_cats:
                                  all_cats.append(c)

          out = subprocess.check_output(["python", "scripts/siimatchmind_client.py"], text=True, encoding="utf-8")
          new_summary = json.loads(out[out.find("{"):])

          cats_map = new_summary.get("categories")
          if isinstance(cats_map, dict):
              for c in all_cats:
                  cats_map.setdefault(c, {"competitions": 0, "matches": 0, "standings": 0, "news": 0})
          elif isinstance(cats_map, list):
              for c in all_cats:
                  if c not in cats_map:
                      cats_map.append(c)

          path = "api/siimatchmind_summary.json"
          if os.path.exists(path):
              with open(path, encoding="utf-8") as fp:
                  old_summary = json.load(fp)
              old_cmp = {k: v for k, v in old_summary.items() if k != "updated_at"}
              new_cmp = {k: v for k, v in new_summary.items() if k != "updated_at"}
              if old_cmp == new_cmp:
                  new_summary["updated_at"] = old_summary.get("updated_at", new_summary.get("updated_at"))

          with open(path, "w", encoding="utf-8") as fp:
              json.dump(new_summary, fp, ensure_ascii=False, indent=2)
          PY

      - name: Commit and push updated API files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore: update para-football API endpoints [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
