name: Update Sii-Football API

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install optional PDF parser
        run: pip install --quiet pypdf || true

      - name: Run data ingestion and league parser
        run: |
          python3 scripts/fetch_data.py
          python3 scripts/parse_leagues.py
          python3 scripts/parse_standings.py

      - name: Commit and push updated API JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/
          git diff --staged --quiet || (git commit -m "Auto-update para-football API endpoints" && git push)
