name: Update Sii-Football Data
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scrapers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then unset DATABASE_URL; fi
          python scripts/run_scrapers.py
      - name: Commit data
        run: |
          git config user.name "sii-football-bot"
          git config user.email "berramouhcine13@gmail.com"
          git add data || true
          git diff --cached --quiet || (git commit -m "chore: auto-update data" && git push)
