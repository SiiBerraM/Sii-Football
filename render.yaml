services:
  - type: web
    name: sii-football-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ADMIN_API_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REQUIRE_API_KEY
        value: "true"
